name: CI
on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master]
    tags: '*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests, Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    env:
      # glibc >= 2.41 (e.g. Ubuntu 26.04) refuses to dlopen shared libraries that request
      # an executable stack. Julia 1.9's bundled libopenlibm.so does, causing
      # "cannot enable executable stack as shared object requires: Invalid argument".
      # This tunable restores the old behavior; it is ignored by older glibc and other OSes.
      # Remove when min version is above 1.9
      GLIBC_TUNABLES: glibc.rtld.execstack=2
    strategy:
      fail-fast: false
      matrix:
        version: ['min', '1', 'pre', 'nightly']
        os:  [ubuntu-latest, windows-latest, macos-latest]
        arch: ['default']
        include:
          - os: ubuntu-latest
            version: '1'
            arch: x86
    steps:
      # Do tests
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
